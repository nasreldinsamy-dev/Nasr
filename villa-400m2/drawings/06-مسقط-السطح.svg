<text x="408.00" y="46.60" class="t3" text-anchor="start" direction="rtl">• عزل مائي (ممبرين) فوق طبقة ميول خرسانة خفيفة.</text>
<text x="408.00" y="51.00" class="t3" text-anchor="start" direction="rtl">• عزل حراري 5 سم فوم أسفل بلاط المشايات.</text>
<text x="408.00" y="55.40" class="t3" text-anchor="start" direction="rtl">• ميول 1.5% نحو 4 مصارف مطر قطر 4 بوصة.</text>
<text x="408.00" y="59.80" class="t3" text-anchor="start" direction="rtl">• سور مبانٍ ارتفاع 1.00 م حول السطح وحول المنور.</text>
<text x="408.00" y="64.20" class="t3" text-anchor="start" direction="rtl">• خزانان علويان سعة 1000 لتر لكل شقة.</text>
<text x="408.00" y="68.60" class="t3" text-anchor="start" direction="rtl">• قواعد خرسانية للخزانات ووحدات التكييف.</text>
<text x="408.00" y="73.00" class="t3" text-anchor="start" direction="rtl">• غرفة السلم مسقوفة وبها باب خروج للسطح.</text>
<text x="408.00" y="77.40" class="t3" text-anchor="start" direction="rtl">• السطح حق انتفاع لشقة الدور الأول.</text>
